[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "silo-amp-design"
version = "0.1.0"
description = "SILO for AMP Challenge 2027 submission"
readme = "README.md"
requires-python = "==3.10.18"
dependencies = [    
"torch==2.8.0+cu128",
"torchaudio==2.8.0+cu128",
"torchvision==0.23.0+cu128",
"torchdata",
"torchtext",
"torchtune",
"numpy==1.26.4",
"ray==2.50.0",
"tqdm==4.67.1",
"requests==2.32.5",
"pandas==2.2.2",
"scikit-learn==1.5.2",
"matplotlib==3.9.4",
"scipy==1.15.3",
"biotite==1.2.0",
"transformers==4.48.1",
"fair-esm==2.0.0",
"biopython==1.85", 
"ninja==1.13.0",
"esm==3.2.1.post1",
"Levenshtein==0.27.3", 
"modlamp==4.3.2", 
"xgboost==3.2.0",
"pytorch-lightning==2.6.5",
"h5py==3.16.0",
"peptides==0.5.0",
"peptidy==0.0.1", 
"mlflow==3.4.0",
"gdown"]

[project.scripts]
generate = "SILO_amp.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["SILO_amp"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
